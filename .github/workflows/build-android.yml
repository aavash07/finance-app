name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & pack rn-sdk
        working-directory: rn-sdk
        run: |
          set -euo pipefail

          # Install and build the rn-sdk package
          npm ci
          npm run build

          # Pack and capture the produced tarball filename reliably
          tgz=$(npm pack --silent)
          echo "Packed: $tgz"

          # Debug listing
          echo "rn-sdk directory listing:"
          ls -la

          # Copy the tgz into mobile-app so the subsequent npm ci in mobile-app can use it
          cp "$tgz" ../mobile-app/ || { echo "Failed to copy $tgz to ../mobile-app/"; ls -la .. || true; exit 1; }
          echo "Copied $tgz to ../mobile-app/"

      - name: Install dependencies
        run: |
          set -euo pipefail

          # Ensure official npm registry
          npm config set registry https://registry.npmjs.org/

          # Remove possible corrupted cache and verify
          rm -rf ~/.npm/_cacache
          npm cache clean --force || true
          npm cache verify || true

          # Retry npm ci up to 3 times to handle transient errors
          n=0
          until [ "$n" -ge 3 ]
          do
            npm ci && break
            n=$((n+1))
            echo "npm ci failed, retry $n/3..."
            sleep $((n*5))
          done
          if [ "$n" -ge 3 ]; then
            echo "npm ci failed after 3 attempts" >&2
            exit 1
          fi

          # Install eas-cli globally as before
          npm i -g eas-cli@latest

      - name: Expo auth (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${EAS_TOKEN:-${EXPO_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "Expo/EAS token secret not set (EAS_TOKEN or EXPO_TOKEN)" >&2
            exit 1
          fi
          # Export for eas-cli; no interactive login needed
          export EAS_TOKEN="$TOKEN"
          echo "EAS token exported (hidden). Verifying authentication..."
          if ! eas whoami; then
            echo "Authentication failed; check token validity or scope." >&2
            exit 1
          fi

      - name: Build APK (preview)
        run: |
          eas build -p android --profile preview --non-interactive --wait

      - name: Download latest APK
        run: |
          mkdir -p dist
          eas build:download --platform android --latest --path dist/financekit-preview.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: financekit-preview-apk
          path: mobile-app/dist/financekit-preview.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/dist/financekit-preview.apk
          name: FinanceKit Android Preview ${{ github.ref_name }}
          draft: false
          prerelease: true