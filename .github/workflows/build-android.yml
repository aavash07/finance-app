name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & pack rn-sdk
        working-directory: rn-sdk
        run: |
          npm ci
          TARFILE=$(npm pack --silent | tail -n1 | tr -d '\r')
          echo "Packed tarball: $TARFILE"
          if [ ! -f "$TARFILE" ]; then echo "Tarball not found after pack"; exit 1; fi
          ln -sf "$TARFILE" financekit-rn-sdk-0.1.0.tgz
          ls -l
          echo "RN_SDK_TARBALL=$TARFILE" >> $GITHUB_ENV

      - name: Install dependencies (mobile-app)
        run: |
          echo "Listing rn-sdk directory before install";
          ls -l ../rn-sdk || true
          if [ ! -f ../rn-sdk/financekit-rn-sdk-0.1.0.tgz ]; then echo "Missing expected tarball ../rn-sdk/financekit-rn-sdk-0.1.0.tgz"; exit 1; fi
          npm cache clean --force
          npm ci
          npm i -g eas-cli@latest

      - name: Expo login via token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          TOKEN="${EXPO_TOKEN:-$EAS_TOKEN}"
          if [ -z "$TOKEN" ]; then echo "Expo token secret not set (EXPO_TOKEN or EAS_TOKEN)" && exit 1; fi
          eas login --token "$TOKEN"
          eas whoami || true

      - name: Build APK (preview)
        run: |
          eas build -p android --profile preview --non-interactive --wait

      - name: Download latest APK
        run: |
          mkdir -p dist
          eas build:download --platform android --latest --path dist/financekit-preview.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: financekit-preview-apk
          path: mobile-app/dist/financekit-preview.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/dist/financekit-preview.apk
          name: FinanceKit Android Preview ${{ github.ref_name }}
          draft: false
          prerelease: true