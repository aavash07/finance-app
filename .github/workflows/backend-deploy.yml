name: Backend CI & Deploy (Container)

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'entrypoint.sh'
      - 'capstone_backend/**'
      - 'financekit/**'
  workflow_dispatch:

concurrency: backend-deploy

env:
  IMAGE_NAME: finance-backend
  ACR_NAME: financekit
  RESOURCE_GROUP: azure-free
  WEBAPP_NAME: financekit-backend
  REGISTRY_LOGIN_SERVER: financekit.azurecr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_DB: capstone
          POSTGRES_USER: capstone
          POSTGRES_PASSWORD: capstone
        options: >-
          --health-cmd "pg_isready -U capstone -d capstone" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_NAME: capstone
      DB_USER: capstone
      DB_PASSWORD: capstone
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DEBUG: '0'
      SECRET_KEY: dummy
      ALLOW_DEV_ENDPOINTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test -v 2

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    outputs:
      TAG: ${{ steps.meta.outputs.TAG }}
      LATEST: ${{ steps.meta.outputs.LATEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CE9EA7BECF4432693C0F2A2057151E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47567A2FCAC944DAB471F1B2331A9D5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09AD2B9AA0474E588602C57D3F069CB2 }}
      - name: Ensure ACR
        run: az acr show -n "$ACR_NAME" >/dev/null 2>&1 || az acr create -n "$ACR_NAME" -g "$RESOURCE_GROUP" --sku Basic
      - name: Set tags
        id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "TAG=${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:${SHA}" >> $GITHUB_OUTPUT
          echo "LATEST=${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
      - name: ACR Login
        run: az acr login -n "$ACR_NAME"
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.TAG }}
            ${{ steps.meta.outputs.LATEST }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.LATEST }}
          cache-to: type=inline

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CE9EA7BECF4432693C0F2A2057151E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47567A2FCAC944DAB471F1B2331A9D5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09AD2B9AA0474E588602C57D3F069CB2 }}
      - name: ACR Login
        run: az acr login -n "$ACR_NAME"
      - name: Pull Trivy
        run: docker pull aquasec/trivy:latest
      - name: Scan image HIGH/CRITICAL
        env:
          TARGET_IMAGE: ${{ needs.build.outputs.LATEST }}
        run: |
          set -e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$TARGET_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --format table "$TARGET_IMAGE" > trivy-report.txt || true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  deploy:
    runs-on: ubuntu-latest
    needs: [build, scan]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6CE9EA7BECF4432693C0F2A2057151E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47567A2FCAC944DAB471F1B2331A9D5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_09AD2B9AA0474E588602C57D3F069CB2 }}
      - name: Update WebApp image
        run: |
          az webapp config container set --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --docker-custom-image-name "${{ needs.build.outputs.LATEST }}" --docker-registry-server-url "https://${REGISTRY_LOGIN_SERVER}" || exit 1
          az webapp restart --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Health check
        run: |
          set -e
          for i in $(seq 1 10); do
            CODE=$(curl -o /dev/null -s -w "%{http_code}" https://$WEBAPP_NAME.azurewebsites.net/health || true)
            if [ "$CODE" = "200" ]; then echo "Healthy"; exit 0; fi
            echo "Attempt $i health code=$CODE"; sleep 6
          done
          echo "Health check failed" >&2; exit 1
      - name: Summary
        run: |
          echo "Deployed image: ${{ needs.build.outputs.LATEST }}" >> $GITHUB_STEP_SUMMARY
          echo "WebApp: $WEBAPP_NAME" >> $GITHUB_STEP_SUMMARY
