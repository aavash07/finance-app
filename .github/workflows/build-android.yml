name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_ACCESS_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      EAS_BUILD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      EAS_BUILD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EAS_BUILD_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # rn-sdk no longer exists; SDK is inlined in mobile-app/sdk

      - name: Install mobile-app dependencies
        run: |
          set -euo pipefail

          # Ensure official npm registry
          npm config set registry https://registry.npmjs.org/

          # Remove possible corrupted cache and verify
          rm -rf ~/.npm/_cacache
          npm cache clean --force || true
          npm cache verify || true

          # Use npm install first because lockfile may need regeneration after folder dependency switch
          # Retry up to 3 times to handle transient network issues
          n=0
          until [ "$n" -ge 3 ]
          do
            npm install && break
            n=$((n+1))
            echo "npm ci failed, retry $n/3..."
            sleep $((n*5))
          done
          if [ "$n" -ge 3 ]; then
            echo "npm install failed after 3 attempts" >&2
            exit 1
          fi

          # Install eas-cli globally as before
          npm i -g eas-cli@latest

      - name: Expo auth (non-interactive)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${EXPO_TOKEN:-}"
          if [ -z "$TOKEN" ]; then echo "EXPO_TOKEN secret not set" >&2; exit 1; fi
          # Export for eas-cli; no interactive login needed
          # Persist for subsequent steps explicitly
          echo "EXPO_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "EAS_ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "EAS token exported (hidden). Verifying authentication..."
          if ! eas whoami; then
            echo "Authentication failed; check token validity or scope." >&2
            exit 1
          fi

      - name: Prepare Android credentials (local)
        run: |
          set -euo pipefail
          # Decode keystore from base64 secret into file
          echo "$EAS_BUILD_ANDROID_KEYSTORE_BASE64" | base64 -d > financekit-mobile.keystore
          if [ ! -s financekit-mobile.keystore ]; then echo "Keystore decode failed" >&2; exit 1; fi
          # Verify alias exists inside keystore (storepass required)
          keytool -list -keystore financekit-mobile.keystore -storepass "$EAS_BUILD_ANDROID_KEYSTORE_PASSWORD" || { echo "Failed to list keystore" >&2; exit 1; }
          # Generate credentials.json with actual secret values interpolated
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "financekit-mobile.keystore",
                "keystorePassword": "${EAS_BUILD_ANDROID_KEYSTORE_PASSWORD}",
                "keyAlias": "${EAS_BUILD_ANDROID_KEYSTORE_ALIAS}",
                "keyPassword": "${EAS_BUILD_ANDROID_KEY_PASSWORD}"
              }
            }
          }
          EOF
          # Show limited confirmation (omit passwords)
          echo "credentials.json generated:"; grep -E 'keystorePath|keyAlias' credentials.json || true
          # Basic validation using jq
          jq '.android.keystore.keyAlias' credentials.json >/dev/null 2>&1 || { echo "Invalid credentials.json" >&2; exit 1; }

      - name: Build APK (preview)
        run: |
          set -euo pipefail
          for v in EAS_BUILD_ANDROID_KEYSTORE_BASE64 EAS_BUILD_ANDROID_KEYSTORE_PASSWORD EAS_BUILD_ANDROID_KEY_PASSWORD EAS_BUILD_ANDROID_KEYSTORE_ALIAS; do
            if [ -z "${!v:-}" ]; then echo "Missing required Android credential env: $v" >&2; exit 1; fi
          done
          if [ ! -f credentials.json ]; then echo "credentials.json missing; generation step failed" >&2; exit 1; fi
          # Extra keystore integrity check before build
          keytool -list -keystore financekit-mobile.keystore -storepass "$EAS_BUILD_ANDROID_KEYSTORE_PASSWORD" | grep -i "Alias name" || echo "(Alias listing non-critical)"
          # Run build and save JSON result containing build id
          eas build -p android --profile preview --non-interactive --clear-cache --wait --json | tee build.json

      - name: Download latest APK
        run: |
          set -euo pipefail
          mkdir -p dist
          # Try to get build id from build.json
          BUILD_ID=$(jq -r '.[0].id // .id // .builds[0].id // empty' build.json 2>/dev/null || true)
          if [ -z "$BUILD_ID" ]; then
            echo "[warn] build.json did not contain a build id. Trying to get latest build from EAS..."
            OUT=$(eas build:list --platform android --limit 1 --json 2>&1)
            echo "[debug] eas build:list output: $OUT"
            BUILD_ID=$(echo "$OUT" | jq -r '.[0].id' 2>/dev/null || true)
            if [ -z "$BUILD_ID" ]; then
              echo "[error] Could not find a valid build id. Raw output: $OUT" >&2
              exit 1
            fi
          fi
          echo "Downloading build $BUILD_ID ..."
          # Removed incorrect flags. Only use the correct command below.
          echo "Extracting APK URL from EAS build output..."
          # Parse buildUrl or applicationArchiveUrl from the EAS build output JSON
          BUILD_URL=$(cat build-info.json | jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl')
          echo "Downloading APK using curl from $BUILD_URL ..."
          curl -L "$BUILD_URL" -o dist/financekit-preview.apk
            eas build:download -b "$BUILD_ID" -o dist/financekit-preview.apk
            # The above command uses the correct flags for build id and output path.
            # Ensure the command is executed correctly.

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: financekit-preview-apk
          path: mobile-app/dist/financekit-preview.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/dist/financekit-preview.apk
          name: FinanceKit Android Preview ${{ github.ref_name }}
          draft: false
          prerelease: true