services:
  web:
    build: .
    container_name: capstone-web
    environment:
      DJANGO_ENV: production
      SECRET_KEY: changeme-super-secret
      # SQLite default; no external DB or Redis required
    volumes:
      - sqlite_data:/app/db_data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sqlite_data:
