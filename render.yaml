services:
  - type: web
    name: finance-app-backend
    env: docker
    autoDeploy: true
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TESSERACT_CMD
        value: "/usr/bin/tesseract"
      # Optional: set SECRET_KEY here or in Render dashboard as a Secret
      # - key: SECRET_KEY
      #   generateValue: true
    
    # If you switch from SQLite to Postgres later, create a Render PostgreSQL and add DATABASE_URL
    # envVars:
    #   - key: DATABASE_URL
    #     fromDatabase:
    #       name: finance-app-db
    #       property: connectionString

databases:
  - name: finance-app-db
    plan: free
    # Uncomment above envVars/DATABASE_URL and this db if you decide to use Postgres for persistence.
