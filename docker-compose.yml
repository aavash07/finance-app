services:
  web:
    build: .
    container_name: capstone-web
    environment:
      DJANGO_ENV: production
      SECRET_KEY: changeme-super-secret
      DB_ENGINE: postgresql
      DB_NAME: capstone
      DB_USER: capstone
      DB_PASSWORD: capstone
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  db:
    image: postgres:15
    container_name: capstone-db
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: capstone-redis
    ports:
      - "6379:6379"

volumes:
  dbdata:
